[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster_factor"
version = "0.1.0"
description = "Business Continuity Disaster Tracker"
readme = "README.md"
authors = [ { name = "Your Name", email = "you@example.com" } ]
license = { text = "MIT" }

# Runtime dependencies: taken directly from requirements.txt as a starting point.
# Consider moving test/dev-only packages (pytest, pluggy, iniconfig, Pygments) into
# [project.optional-dependencies] or a separate dev/constraints file.
dependencies = [
  "beautifulsoup4==4.14.2",
  "bs4==0.0.2",
  "certifi==2025.10.5",
  "charset-normalizer==3.4.4",
  "colorama==0.4.6",
  "idna==3.11",
  "iniconfig==2.3.0",
  "lxml==6.0.2",
  "packaging==25.0",
  "pluggy==1.6.0",
  "Pygments==2.19.2",
  "pytest==9.0.0",
  "requests==2.32.5",
  "soupsieve==2.8",
  "typing_extensions==4.15.0",
  "urllib3==2.5.0",
]

[project.urls]
"Homepage" = "https://example.org/"

