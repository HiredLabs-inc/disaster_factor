[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster_factor"
version = "0.0.0"
description = "Business Continuity Disaster Tracker"
readme = "README.md"
authors = [
  { name = "Jeff Stock", email = "jeff.stock@hiredlabs.org" },
  { name = "Daniel Murillo", email = "hoorayfordantheman@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
  "beautifulsoup4==4.14.2",
  "bs4==0.0.2",
  "certifi==2025.10.5",
  "charset-normalizer==3.4.4",
  "colorama==0.4.6",
  "idna==3.11",
  "lxml==6.0.2",
  "packaging==25.0",
  "requests==2.32.5",
  "soupsieve==2.8",
  "typing_extensions==4.15.0",
  "urllib3==2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.0",
  "pluggy==1.6.0",
  "iniconfig==2.3.0",
  "Pygments==2.19.2",
]

[project.urls]
"Homepage" = "https://example.org/"
