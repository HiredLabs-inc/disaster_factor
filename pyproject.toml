[tool.poetry]
name = "disaster_factor"
version = "0.1.0"
description = "Business Continuity Disaster Tracker"
repository = "https://github.com/HiredLabs-inc/disaster_factor"
keywords = ["disaster", "tracking", "business-continuity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
]

authors = [
  "Jeff Stock <jeff.stock@hiredlabs.org>",
  "Daniel Murillo <hoorayfordantheman@gmail.com>"
]

license = "GPL-3.0-or-later"
readme = "README.md"

packages = [{ include = "disaster_factor", from = "src" }]

include = [
  "src/disaster_factor/static/**"
]

[tool.poetry.scripts]
disaster-factor = "disaster_factor.cli:main"

[tool.poetry.dependencies]
python = ">=3.10"
beautifulsoup4 = "4.14.2"
certifi = "2025.10.5"
charset-normalizer = "3.4.4"
colorama = "0.4.6"
idna = "3.11"
lxml = "6.0.2"
packaging = "25.0"
requests = "2.32.5"
soupsieve = "2.8"
typing_extensions = "4.15.0"
urllib3 = "2.5.0"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "9.0.0"
pluggy = "1.6.0"
iniconfig = "2.3.0"
Pygments = "2.19.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"